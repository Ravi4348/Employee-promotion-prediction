<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Promotion Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>Employee Promotion Prediction</h1>
            <p>Predict if an employee will be promoted based on experience.</p>
        </header>

        <div class="form-container">
            <form class="prediction-form" onsubmit="predictPromotion(event)">
                <div class="form-group">
                    <label for="first_name">First Name:</label>
                    <input type="text" id="first_name" name="first_name" placeholder="Enter First Name" required>
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name:</label>
                    <input type="text" id="last_name" name="last_name" placeholder="Enter Last Name" required>
                </div>

                <div class="form-group">
                    <label for="Gender">Gender:</label>
                    <select id="Gender" name="Gender" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter Email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="text" id="phone" name="phone" placeholder="Enter Phone Number" required>
                </div>

                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" placeholder="Enter Age" required>
                </div>

                <div class="form-group">
                    <label for="experience">Experience (in years):</label>
                    <input type="number" id="experience" name="experience" placeholder="Enter Experience" required>
                </div>

                <div class="form-group">
                    <label for="job_title">Job Title:</label>
                    <select id="job_title" name="job_title" required>
                        <option value="">Select Job Title</option>
                        <option value="1">Junior Developer</option>
                        <option value="2">Senior Software Engineer</option>
                        <option value="3">Tech Lead / Lead Engineer</option>
                        <option value="4">Principal Engineer</option>
                        <option value="5">Senior Engineering Manager</option>
                        <option value="6">VP of Engineering</option>
                        <option value="7">CTO (Chief Technology Officer)</option>
                    </select>
                </div>

                <button type="submit">Predict Promotion</button>
            </form>

            <div id="prediction-result" class="prediction-result"></div>
        </div>

        <footer>
            <p>&copy; 2025 Employee Promotion Prediction | All Rights Reserved</p>
        </footer>
    </div>

    <script>
        function predictPromotion(event) {
            event.preventDefault(); // Prevent form submission

            let experience = document.getElementById("experience").value;
            let resultDiv = document.getElementById("prediction-result");

            if (experience >= 3) {
                resultDiv.innerHTML = "✅ The employee is eligible for promotion!";
                resultDiv.style.color = "green";
            } else {
                resultDiv.innerHTML = "❌ The employee is NOT eligible for promotion.";
                resultDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
